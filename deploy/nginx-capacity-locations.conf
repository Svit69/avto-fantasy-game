# Merge into the existing server block; do not duplicate existing locations.
# Observe shared-IP traffic before changing dry_run to off.
location /api/ {
    client_max_body_size 8m;
    client_body_timeout 60s;
    limit_req zone=avto_api_ip burst=80 nodelay;
    limit_req_dry_run on;
    limit_req_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:3000;
}

location = /api/telegram-webhook {
    client_max_body_size 64k;
    client_body_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:3000;
}

location = /api/ready {
    limit_req zone=avto_health_ip burst=10 nodelay;
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:3000;
}
